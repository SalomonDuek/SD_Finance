<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="tc" content="#eef2f5">
<title>$D Finance</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="iconoSD.png" type="image/png">
<script>try{var t=localStorage.getItem('finanzas.theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}</script>

</head>
<body>
<main>
  <header class="g-head">
    <h1>$D Finance</h1>
    <button id="theme" class="tg" type="button" role="switch" aria-checked="false" aria-label="Modo oscuro">
      <span class="thumb"></span>
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </header>

  <section class="g-saldos">
    <h2>Lo que deberías tener</h2>
    <div id="saldos"></div>
  </section>

  <section class="g-cargar">
    <h2 id="ftitle">Cargar movimiento</h2>
    <div class="seg" id="seg"></div>
    <form id="f"></form>
  </section>

  <section class="g-resumen">
    <h2>Resumen</h2>
    <div class="mnav"><button class="ghost" id="mp" type="button" aria-label="Mes anterior">‹</button><input id="mes" type="month" aria-label="Mes del resumen"><button class="ghost" id="mn" type="button" aria-label="Mes siguiente">›</button></div>
    <div id="resumen" style="margin-top:8px"></div>
  </section>

  <section class="g-lista">
    <h2>Movimientos del mes</h2>
    <div id="lista"></div>
  </section>

  <section class="g-anual">
    <h2>Año completo</h2>
    <div id="anual"></div>
  </section>

  <section class="g-backup">
    <h2>Copia de seguridad</h2>
    <p class="mute" style="margin-top:0">Tus datos viven en este navegador. Exportá un archivo de vez en cuando.</p>
    <div class="tools">
      <button class="ghost" id="exp" type="button">Exportar</button>
      <button class="ghost" id="impb" type="button">Importar</button>
      <input id="imp" type="file" accept="application/json" hidden>
    </div>
  </section>
</main>

<script src="script.js" defer></script>
</body>
</html>
